name: Build Installer

on:
  push:
    tags:
      - 'v*'
  # Пробний прогін без релізу: образи + інсталятор як артефакт, GitHub Release не створюється.
  workflow_dispatch:

env:
  # Тег — версія релізу; ручний прогін — 0.0.0-<sha>, щоб не плутати з релізами.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-{0}', github.sha) }}

# Типово — лише читання; запис (GitHub Release) має тільки build-installer, у власному блоці.
permissions:
  contents: read

jobs:
  # Образи — Linux (node:22-alpine, postgres:16-alpine…), тож збираються на Linux-раннері.
  # На windows-latest Docker працює з Windows-контейнерами: Linux-образ там не збирається і не
  # тягнеться. До того ж у PowerShell `docker save | gzip >` пропускав бінарний потік через
  # текстовий конвеєр і псував архів. Тут — bash, побайтово.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and save Docker images
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p images

          # Образи застосунків збираються самі (multi-stage: pnpm install + build усередині).
          docker build -t "sto-api:$version" -f apps/api/Dockerfile .
          docker build -t "sto-web:$version" -f apps/web/Dockerfile .
          docker save "sto-api:$version" | gzip > images/sto-api.tar.gz
          docker save "sto-web:$version" | gzip > images/sto-web.tar.gz

          # Базові образи — ті самі теги, що в docker-compose.yml (compose шукає саме їх).
          save_base() {
            docker pull "$1"
            docker save "$1" | gzip > "images/$2.tar.gz"
          }
          save_base postgres:16-alpine postgres-16
          save_base redis:7-alpine redis-7
          save_base minio/minio:RELEASE.2024-01-16T16-07-38Z minio
          save_base caddy:2-alpine caddy

          # Архів цілий: gzip читається до кінця, tar усередині — валідний.
          for f in images/*.tar.gz; do gzip -t "$f" && gzip -dc "$f" | tar -t > /dev/null; done
          ls -lh images

      - uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images/*.tar.gz
          # Уже стиснуто — повторне стиснення лише витрачає час.
          compression-level: 0
          retention-days: 1

  build-installer:
    needs: images
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: installer/bundle/images

      - name: Download NSSM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/bundle | Out-Null
          Invoke-WebRequest -Uri "https://nssm.cc/ci/nssm-2.24-103-gdee49fc.zip" -OutFile nssm.zip
          Expand-Archive nssm.zip -DestinationPath nssm-temp
          Copy-Item nssm-temp\nssm-*\win64\nssm.exe installer\bundle\nssm.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          $version = "$env:VERSION" -replace '^v',''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "installer\inno\setup.iss" `
            "/DAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: STO-ERP-Setup-${{ env.VERSION }}
          path: installer/output/*.exe
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: installer/output/*.exe
          generate_release_notes: true
          name: STO ERP ${{ github.ref_name }}
