name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Повний E2E (e2e-full) можна запустити вручну на будь-якій гілці — напр. перед релізом
  # або коли PR зачіпає багато UI. На PR за замовчуванням іде лише smoke.
  workflow_dispatch:
    inputs:
      run_full_e2e:
        description: 'Запустити повний E2E (50 spec, 361 тест) замість smoke'
        type: boolean
        default: true

jobs:
  # Якісні гейти — type-check + lint + unit-тести на кожен PR/push. Раніше CI мав ЛИШЕ
  # migration-safety, тож зламаний type-check/lint/тест не ловився до релізу (напр. mobile-tsc,
  # відсутній backend-lint). Юніт-тести замокані (без реальних БД/Redis), тож зовнішні сервіси
  # не потрібні; лише prisma generate для типів @prisma/client.
  quality:
    runs-on: ubuntu-latest
    env:
      # Prisma 7 читає prisma.config.ts, а той вимагає DATABASE_URL для валідації
      # datasource — навіть для `generate` без доступу до БД. Реального підключення тут
      # немає (БД не піднімається), тож значення фіктивне: потрібен лише валідний URL.
      DATABASE_URL: postgresql://sto:sto@localhost:5432/sto_erp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sto/database exec prisma generate

      - name: Type-check (api · web · shared · mobile)
        run: pnpm run type-check

      - name: Lint (api · web · mobile)
        run: pnpm run lint

      # --reporter=json ДОДАТКОВО до дефолтного: звіт потрібен гейту A нижче, і так
      # він не коштує окремого прогону тестів.
      # @sto/shared: його єдиний спек (i18n key-parity) до 2026-10-07 не ганявся НІДЕ в CI —
      # крок називався «Unit tests», а фільтрував лише api та web. Мутація плейсхолдера
      # `{{max}}` в messages.en.ts лишала api і web зеленими.
      - name: Unit tests
        run: pnpm --filter @sto/api exec vitest run --reporter=default --reporter=json --outputFile=.vitest-report.json && pnpm --filter @sto/web run test && pnpm --filter @sto/shared run test

      # Пороги покриття живуть у apps/api/vitest.config.ts і зафіксовані від фактичного
      # рівня (аудит 2026-10). Крок падає, якщо покриття просіло нижче порога — раніше
      # coverage був налаштований у конфізі, але НІКОЛИ не запускався (навіть пакет
      # @vitest/coverage-v8 не був встановлений), тож регрес покриття не ловився взагалі.
      - name: Coverage thresholds (api)
        run: pnpm --filter @sto/api exec vitest run --coverage

      # Циклічні залежності — БЛОКУЮЧИЙ крок: на момент вмикання їх було 0 (три цикли в
      # xlsx-модулі розірвано винесенням grid-geometry і text-layer-registry), тож поріг
      # «жодного» утримати реально, і кожен новий цикл видно одразу.
      # Інструмент — dependency-cruiser, а не madge: madge@8 (остання) прибита до
      # typescript ^5.4.4 і на TS 7 падає з «Cannot read properties of undefined».
      - name: Circular dependencies
        run: pnpm run cycles

      # Мертвий код — ЗВІТНИЙ крок (--no-exit-code): knip корисний, але частина знахідок
      # лишається оцінковою (динамічні імпорти, ESLint-плагіни). Блокувати на цьому PR не
      # варто — звіт читається очима.
      - name: Dead code report
        run: pnpm run deadcode

      # Stop-hook, що блокує вердикт/цифри без доказу (.claude/settings.json), ламався
      # ТРИЧІ за один день, і щоразу ВИГЛЯДАВ робочим: (1) sys.stdin.read() декодував
      # консольним cp1251, тож кирилиця в payload'і ставала мояибаке і регулярки не
      # матчились — hook тихо пропускав рівно те, що мав блокувати; (2) гола пропорція
      # «7/7» не детектувалась; (3) \b у генераторі правок двічі став літеральним \x08.
      # Жодне з трьох не видно ні в grep, ні в py_compile, ні очима — лише запуском.
      # Тест ганяє hook ПРОЦЕСОМ і порівнює exit code, тому ловить усі три класи.
      # Кодування-незалежний: перевірено під LANG=en_US.UTF-8, PYTHONIOENCODING=cp1251
      # і PYTHONUTF8=0 — результат однаковий, тож на ubuntu-runner стабільний.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Stop-hook contract (claims need evidence)
        run: python3 scripts/hooks/test-check-claims.py

      # Селектор вирішує, які тести НЕ запускати локально. Помилка в ньому дає не червоний
      # тест, а зелений прогін без потрібного тесту — тож сам вибір перевіряється тут.
      # CI при цьому завжди ганяє ВСЕ; селектор — лише для локального циклу.
      - name: Test selector contract (affected-tests)
        run: python3 scripts/test-affected-tests.py

      # Посилання між .md не валідує ні tsc, ні eslint, а в GitHub-рендері битий лінк
      # виглядає як звичайний текст — помітно лише коли клікнеш. Станом на 2026-10-05
      # битими були 14 із 66: docs/ARCHITECTURE.md посилався на ../objects/<entity>.md,
      # хоча сам лежить у docs/ (тобто шлях вів у <корінь>/objects/, якого немає), і це
      # жило довго. Мутація перевірена: внесене биття дає exit 1 і назву файлу.
      - name: Doc links resolve
        run: python3 scripts/check-doc-links.py

      # Три гейти спец-орієнтованих тестів. Гейт A (втрата кейсів) порівнює МНОЖИНИ
      # fullName проти apps/api/test-baseline.json, а не суми: «182 -> 182» не виключає
      # «втратив один кейс і продублював інший». Привід: 2026-10-05 розбиття спеку
      # знищило наявний purchase-orders.contract.spec.ts (593 рядки) — втрату зловила
      # не перевірка, а випадкова арифметика (47+101 != 182).
      # Гейт B (нові моноліти) відкалібрований: на момент вмикання називав РІВНО 8 файлів,
      # тобто поріг 900 ловить саме цілі й нічого крім них.
      # Гейт C (цілісність дос'є) закриває дірку check-doc-links.py, який за конструкцією
      # бачить лише .md-цілі, а не .ts-шляхи з реєстрів.
      - name: Spec registry gates
        run: python3 scripts/check-spec-registry.py --from-report apps/api/.vitest-report.json

  # R5 (pre-prod re-review): PowerShell-інсталятор раніше НЕ мав жодного quality-gate — саме тому
  # T15 CRITICAL (New-RandomBase64 крашив на PS 5.1 через статичний RandomNumberGenerator::GetBytes,
  # відсутній у .NET Framework) прослизнув повз усі аудити. Цей job на windows-latest (Windows
  # PowerShell 5.1 Desktop — цільова платформа інсталятора) AST-парсить усі .ps1 + smoke-тестить
  # генератор секретів на РЕАЛЬНОМУ 5.1-рантаймі, щоб такі регреси ловились на CI.
  # Прод постачається як Docker-образи у .tar.gz всередині інсталятора (ADR-003), але
  # збирались вони ЛИШЕ в release.yml по тегу — тобто вада збірки виявлялась аж на релізі.
  # Саме так пройшли повз три незалежні вади Dockerfile (@sto/shared не резолвився 119×
  # TS2307; `pnpm prune` без TTY; husky після видалення devDeps) — аудит 2026-10.
  # Тут образи збираються на КОЖЕН PR. Без push/registry: нас цікавить лише те, що збірка
  # взагалі проходить.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: sto-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: sto-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # 7 integration-специв (tenant-guard, append-only тригери, field-encryption,
  # schema-integrity, dead-letter, stock-effects, line-import) ходять у РЕАЛЬНУ Postgres.
  # Досі CI їх не піднімав → вони завжди йшли у skip, і «ЄДИНЕ реальне покриття guard-а»
  # (цитата з коментаря в tenant-guard.integration.spec.ts) не виконувалось жодного разу.
  #
  # REQUIRE_DB=1 КРИТИЧНИЙ: без нього специ при збої підключення або незасіяній базі знову
  # тихо пропустяться, і job лишиться зеленим — тобто ми б додали Postgres і не помітили,
  # що він не використовується. З прапорцем недоступна БД валить набір (common/testing/require-db.ts).
  # Бюджет розміру бандла. Web вантажиться у планшети механіків по WiFi у цеху, тож
  # непомічене зростання — це секунди очікування на кожному відкритті сторінки.
  #
  # ДВІ перевірки, бо вони міряють РІЗНЕ:
  #  · `size` (size-limit) — сумарний JS бандла; ловить «притягнули важку залежність»;
  #  · `size:pages` — first load КОНКРЕТНОЇ сторінки (чанки, згадані в її HTML).
  #    size-limit так не вміє: для glob він рахує СУМУ всіх файлів, а не те, що
  #    завантажує одна сторінка — тому окремий скрипт.
  # Виміряно 2026-10-04: бандл 1.28 MB gzip, найважча сторінка /invoices 512 KB gzip.
  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sto/database exec prisma generate

      - name: Build shared
        run: pnpm --filter @sto/shared build

      - name: Build web (static export)
        run: pnpm --filter @sto/web build

      - name: Бюджет усього бандла
        run: pnpm --filter @sto/web size

      - name: Бюджет first-load на сторінку
        run: pnpm --filter @sto/web size:pages

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sto
          POSTGRES_PASSWORD: sto_dev_secret
          POSTGRES_DB: sto_erp
        ports:
          - 5432:5432
        # Без health-check job стартує раніше, ніж Postgres прийме з'єднання.
        options: >-
          --health-cmd "pg_isready -U sto -d sto_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sto:sto_dev_secret@localhost:5432/sto_erp
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @sto/database exec prisma migrate deploy

      - name: Generate Prisma client
        run: pnpm --filter @sto/database exec prisma generate

      # Специ вимагають не лише живої БД, а й засіяних даних: beforeAll шукає garageBranch
      # і без нього йде у skip (тепер — валить, бо REQUIRE_DB=1).
      - name: Seed database
        run: pnpm --filter @sto/database run seed

      - name: Integration tests
        run: pnpm --filter @sto/api exec vitest run src/prisma src/modules/dead-letter src/modules/work-orders/work-order-stock-effects.integration.spec.ts src/modules/xlsx/document-line-import.adapter.integration.spec.ts

  # E2E (smoke-підмножина). 321 тест ганявся ЛИШЕ локально — у CI Playwright не було
  # взагалі. Тут беремо smoke + auth-flow (14 тестів): вони відповідають на головне
  # питання «чи піднявся стек і чи працює вхід», не перетворюючи кожен PR на 5 хвилин.
  #
  # NEXT_PUBLIC_E2E=1 ОБОВ'ЯЗКОВИЙ при запуску web: прапорець гейтиться на етапі збірки,
  # і без нього auth-hatch tree-shake-иться геть → storageState не допомагає і ВСІ тести
  # редіректять на /login. Ця пастка вже траплялась; у playwright.config webServer у CI
  # вимкнений саме тому, що сервер піднімає цей workflow.
  e2e-smoke:
    runs-on: ubuntu-latest
    # Без явного ліміту job висів би до GitHub-дефолту 6 год, якби сервер не піднявся.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sto
          POSTGRES_PASSWORD: sto_dev_secret
          POSTGRES_DB: sto_erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sto -d sto_erp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sto:sto_dev_secret@localhost:5432/sto_erp
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      NEXT_PUBLIC_API_URL: http://localhost:3000
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate + generate + seed
        run: |
          pnpm --filter @sto/database exec prisma migrate deploy
          pnpm --filter @sto/database exec prisma generate
          pnpm --filter @sto/database run seed

      - name: Build shared
        run: pnpm --filter @sto/shared build

      - name: Start API
        run: |
          pnpm --filter @sto/api dev > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 3
          done
          echo "API не піднявся за 180с:"; tail -40 /tmp/api.log; exit 1

      - name: Start web
        env:
          # Без цього прапорця auth-hatch не компілюється і ВСІ тести йдуть у /login.
          NEXT_PUBLIC_E2E: '1'
        run: |
          pnpm --filter @sto/web dev > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001 > /dev/null && exit 0
            sleep 3
          done
          echo "web не піднявся за 180с:"; tail -40 /tmp/web.log; exit 1

      - name: Install Playwright browser
        run: pnpm --filter @sto/web exec playwright install --with-deps chromium

      - name: Run smoke E2E
        run: pnpm --filter @sto/web exec playwright test e2e/smoke.spec.ts e2e/auth-flow.spec.ts --reporter=list

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/test-results/
            /tmp/api.log
            /tmp/web.log
          retention-days: 7

  # E2E (ПОВНИЙ набір: 50 spec-файлів, 361 тест — вимір `playwright test --list`;
  # серед них a11y.spec.ts — axe-core у режимі храповика).
  # Доповнює e2e-smoke, а не замінює:
  # smoke дає швидкий відгук на КОЖЕН PR (14 тестів, ~2 хв), повний набір ловить регресії,
  # яких smoke не бачить — CRUD усіх агрегатів, FSM нарядів, кеш-інвалідація, console-errors.
  #
  # ЧОМУ НЕ НА КОЖЕН PR: 361 тест × (45с timeout + 2 retries) — десятки хвилин на кожен PR.
  # Тому: автоматично на push у main (там регресія вже змержена — треба знати негайно) і
  # вручну через workflow_dispatch (перед релізом / коли PR зачіпає багато UI).
  #
  # ОБОВ'ЯЗКОВІ УМОВИ, кожна вже коштувала окремого падіння:
  #  · NEXT_PUBLIC_E2E=1 при запуску web — прапорець гейтиться на ЗБІРЦІ; без нього
  #    auth-hatch tree-shake-иться і ВСІ тести редіректять на /login (storageState не
  #    рятує, бо нема що підхоплювати);
  #  · seed БД — специ чекають довідники (статуси, одиниці, способи оплати);
  #  · playwright.config: webServer у CI вимкнений (сервери піднімає цей workflow),
  #    workers=2 (dev-throttler: 10 req/min на /auth/login — 4+ воркери дають 429).
  e2e-full:
    runs-on: ubuntu-latest
    # Повний прогін локально ≈ 6-9 хв; 40 — запас на холодну компіляцію Next.js у CI
    # (перший прохід компілює сторінки on-demand) + 2 retries на flaky.
    timeout-minutes: 40
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sto
          POSTGRES_PASSWORD: sto_dev_secret
          POSTGRES_DB: sto_erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sto -d sto_erp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sto:sto_dev_secret@localhost:5432/sto_erp
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      NEXT_PUBLIC_API_URL: http://localhost:3000
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate + generate + seed
        run: |
          pnpm --filter @sto/database exec prisma migrate deploy
          pnpm --filter @sto/database exec prisma generate
          pnpm --filter @sto/database run seed

      - name: Build shared
        run: pnpm --filter @sto/shared build

      - name: Start API
        run: |
          pnpm --filter @sto/api dev > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 3
          done
          echo "API не піднявся за 180с:"; tail -40 /tmp/api.log; exit 1

      - name: Start web
        env:
          # Без цього прапорця auth-hatch не компілюється і ВСІ тести йдуть у /login.
          NEXT_PUBLIC_E2E: '1'
        run: |
          pnpm --filter @sto/web dev > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001 > /dev/null && exit 0
            sleep 3
          done
          echo "web не піднявся за 180с:"; tail -40 /tmp/web.log; exit 1

      - name: Install Playwright browser
        run: pnpm --filter @sto/web exec playwright install --with-deps chromium

      - name: Run full E2E suite
        run: pnpm --filter @sto/web exec playwright test --reporter=list

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            /tmp/api.log
            /tmp/web.log
          retention-days: 7

  installer-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell AST parse (усі installer .ps1)
        shell: powershell # Windows PowerShell 5.1 Desktop (не pwsh) — цільовий рантайм інсталятора
        run: |
          $failed = $false
          Get-ChildItem installer/scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "::error::AST parse failed: $($_.Name)"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed = $true
            } else { Write-Host "OK: $($_.Name)" }
          }
          if ($failed) { exit 1 }

      - name: Smoke-test генератора секретів на PS 5.1
        shell: powershell
        run: |
          # Витягуємо і виконуємо New-RandomBase64 з Setup-Stack.ps1 (dot-source усього скрипта
          # має side-effects, тож беремо лише функцію через AST) — перевіряємо, що не кидає на 5.1
          # і дає непорожні унікальні alnum-секрети очікуваної довжини.
          $errors = $null; $tokens = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path installer/scripts/Setup-Stack.ps1), [ref]$tokens, [ref]$errors)
          $fn = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'New-RandomBase64' }, $true)
          if (-not $fn) { Write-Host "::error::New-RandomBase64 not found"; exit 1 }
          Invoke-Expression $fn.Extent.Text
          $a = New-RandomBase64 -bytes 24; $b = New-RandomBase64 -bytes 48
          if (-not $a -or -not $b -or $a -eq $b -or $a -notmatch '^[a-zA-Z0-9]+$') {
            Write-Host "::error::New-RandomBase64 produced invalid secret (a.len=$($a.Length) b.len=$($b.Length))"; exit 1
          }
          Write-Host "OK: New-RandomBase64 24b=$($a.Length) 48b=$($b.Length) chars, unique, alnum"

  # A4.1 — guard проти деструктивних міграцій. Prisma-міграції у цьому репо мають бути ADDITIVE
  # (rollback інсталятора спирається на additive-only: image-rollback ≠ DB-rollback). DROP COLUMN/TABLE
  # або звужувальний ALTER TYPE призводять до втрати даних на деплої (прецедент: phase17 DROP COLUMN).
  # Перевіряємо ЛИШЕ НОВІ міграції (git-diff проти базового коміту) — історичні вже застосовані й
  # не мають перевірятись (їхні checksum-и заморожені Prisma). Дозволено з маркером `-- destructive-ok:`.
  migration-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # потрібна історія для diff

      - name: Guard against destructive migrations (changed files only)
        shell: bash
        run: |
          set -euo pipefail
          # База для diff: цільова гілка PR, або попередній коміт push.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="origin/${GITHUB_BASE_REF}"
            git fetch --quiet origin "${GITHUB_BASE_REF}"
          else
            base="${{ github.event.before }}"
          fi
          # Порожня база (перший push гілки) → нема з чим порівнювати, пропускаємо.
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "Немає валідної бази для diff — пропускаємо перевірку."
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=A "$base" HEAD -- \
            'packages/database/prisma/migrations/**/migration.sql' || true)
          if [ -z "$changed" ]; then
            echo "OK: нових міграцій у цьому diff немає."
            exit 0
          fi
          echo "Нові міграції для перевірки:"; echo "$changed"
          bad=""
          for f in $changed; do
            hits=$(grep -niE 'DROP[[:space:]]+(COLUMN|TABLE)|ALTER[[:space:]]+COLUMN[[:space:]].*[[:space:]]TYPE[[:space:]]' "$f" 2>/dev/null \
              | grep -vi 'destructive-ok' || true)
            if [ -n "$hits" ]; then
              bad="${bad}\n${f}:\n${hits}"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Деструктивні DDL у НОВИХ міграціях без маркера '-- destructive-ok: <причина>':"
            echo -e "$bad"
            echo "Міграції мають бути additive. Якщо втрата даних свідома — додайте на той самий рядок"
            echo "коментар '-- destructive-ok: <причина>'."
            exit 1
          fi
          echo "OK: нові міграції additive."
