server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — Next.js static export with trailingSlash
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Next.js content-hashed assets — safe to cache forever (filename changes on rebuild)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static assets by extension
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
