packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  # Bug #573 (CRITICAL): @fastify/middie 9.x вимагає fastify 5.x. Apps/api на fastify 4.28 →
  # API не стартує: "FST_ERR_PLUGIN_VERSION_MISMATCH: @fastify/middie - expected '5.x' fastify
  # version, '4.28.1' is installed". Pin до 8.x — остання fastify-4-сумісна лінія,
  # містить security fixes що були причиною overriding original transitive.
  '@fastify/middie': '^8.0.0'
  # D3 (bull-board): свіжий resolve підтягнув другу копію fastify@4.29.1 поряд із 4.28.1 (через
  # @fastify/static@7 у platform-fastify/swagger vs @6 у bull-board). Дві копії → різні instance-типи
  # → TS2345 на helmet/cookie/multipart у main.ts. Пінимо на єдину 4.28.1 (baseline; задовольняє всі
  # @fastify/* peer-ranges, дедуп у одну копію).
  fastify: '4.28.1'
  next: '>=15.3.6'
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@sentry-internal/node-cpu-profiler': false
  '@swc/core': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
minimumReleaseAgeExclude:
  # bull-board 5.23.0 — остання лінійка сумісна з Fastify 4 (@fastify/view@^8, @fastify/static@^6).
  # v6+/v9 тягнуть @fastify/static@^8 → вимагає Fastify 5 → FST_ERR_PLUGIN_VERSION_MISMATCH.
  - '@bull-board/api@5.23.0'
  - '@bull-board/fastify@5.23.0'
  - '@bull-board/nestjs@5.23.0'
  - '@bull-board/ui@5.23.0'
