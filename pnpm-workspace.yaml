packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  # ІСТОРІЯ (знято 2026-10-02 разом із міграцією на NestJS 11 / Fastify 5):
  # тут жили піни `@fastify/middie: ^8` і `fastify: 4.28.1`. Обидва були обхідними
  # рішеннями для Fastify 4: middie 9.x вимагає fastify 5.x (Bug #573 — API не стартував
  # із FST_ERR_PLUGIN_VERSION_MISMATCH), а пін самого fastify прибирав другу копію 4.29.1,
  # що давала TS2345 на helmet/cookie/multipart.
  # Після переходу на Fastify 5 піни стали шкідливими: саме вони тримали @fastify/middie
  # на вразливій 8.x (CRITICAL — middleware authentication bypass у child plugin scopes).
  # @nestjs/platform-fastify@11 тягне middie 9.3.4 (фікс у 9.3.2) і fastify 5.x напряму.
  # Security-мінімум для next (як і початково: `>=` означає «не нижче за патч безпеки»).
  # Поріч піднято 2026-10-02 з >=15.3.6 до >=16.3.6: у вікні 16.2.0–16.3.5 живе CRITICAL
  # RCE у next/og ImageResponse. У дереві стояла саме 16.3.4.
  # Для НАС вразливість не експлуатовна (next/og у коді не використовується, прод —
  # output:'export', тобто статика без Node-сервера Next), але тримати вразливу версію
  # без потреби немає сенсу.
  next: '>=16.3.6'
  # Єдина копія fastify. @nestjs/platform-fastify@11 пінить fastify на 5.11.3, тоді як
  # apps/api резолвив 5.12.5 — ДВІ копії типів в одному дереві, і `app.register` не
  # приймав плагіни (TS2345 на helmet/cookie/multipart). Причина не у версії, а в дублюванні.
  #
  # Зводимо на 5.12.5, а НЕ на 5.11.3 (яку просить platform-fastify): 5.11.3 вразлива —
  # 4 × HIGH, серед них обхід автентифікації через хибні URL у encapsulated not-found
  # (фікс у 5.12.2). Пін на версію нижче за патч безпеки був би гіршим, ніж дублювання.
  fastify: '5.12.5'
  # brace-expansion: HIGH — DoS через необмежену рекурсію на вкладених brace-групах.
  # Вразлива в дереві саме 5.0.9 (через @fastify/static>glob>minimatch на ПРОД-шляху
  # api, плюс dev-ланцюжок madge). Фікс у 5.0.11; беремо 5.0.12.
  # Прямого оновлення немає — minimatch пінить свій діапазон, тож override.
  brace-expansion: '^5.0.12'
  # Прийшли транзитивно з Prisma 7 — вона тягне драйвери ВСІХ підтримуваних БД, хоча
  # проєкт лише на Postgres. mysql2 у нас недосяжний код (драйвер ніколи не вантажиться),
  # але тримати вразливу версію в дереві без потреби немає сенсу — обидві мають фікси.
  #   mysql2 HIGH: auth plugin downgrade -> leaks plaintext password (фікс 3.22.0)
  #   deepmerge-ts HIGH: stack exhaustion на рекурсивних графах (фікс 8.0.0)
  mysql2: '^3.24.5'
  deepmerge-ts: '^8.0.2'
  # http-cache-semantics HIGH: max-stale дозволяє віддати кешовану відповідь ІНШОГО
  # користувача (cross-user disclosure). Вразливі <=4.2.0; у дереві стояла саме 4.2.0.
  # Довго лишалось відкритим, бо фікс значився у 4.2.1, якої не існувало в реєстрі —
  # остання опублікована була 4.2.0. Тепер є 4.3.0, тож пін знімає останній HIGH на
  # runtime-шляху API.
  # Шлях dev-only: @nestjs/cli > @swc/cli > @xhmikosr/bin-wrapper > got > cacheable-request.
  # У прод-образ не потрапляє, але тримати вразливу версію без потреби немає сенсу.
  http-cache-semantics: '^4.3.0'
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@sentry-internal/node-cpu-profiler': false
  '@swc/core': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  # tesseract.js postinstall — лише opencollective-postinstall (донат-банер), для роботи
  # OCR не потрібен. @napi-rs/canvas postinstall НЕ має взагалі (платформний бінарник
  # резолвиться чистим JS), тому у neverBuiltDependencies він не потрібен — і сам рендер
  # тепер ПОТРІБЕН: растеризація PDF-сканів для OCR. Прод = linux-x64-musl у Docker-образі,
  # тож платформної мультиплікації у бандлі немає (образ будується під одну платформу).
  tesseract.js: false
minimumReleaseAgeExclude:
  # bull-board піднято до 9.x разом із Fastify 5 (стара 5.23.0 була останньою лінійкою під
  # Fastify 4 і тягнула @nestjs/bull-shared@10, несумісний із NestJS 11) — те виключення
  # більше не потрібне.
  #
  # http-cache-semantics@4.3.0 — свідоме виключення з карантину «надто свіжа версія»:
  # це ЄДИНА опублікована версія, що закриває HIGH (advisory вимагає >=4.2.1, а 4.2.1
  # у реєстрі не існує — одразу 4.3.0). Вибір між «свіжа версія у dev-залежності» і
  # «відома вразливість у дереві»; перше менш ризиковане, бо пакет у прод-образ не
  # потрапляє (ланцюжок @nestjs/cli > @swc/cli).
  - http-cache-semantics@4.3.0
