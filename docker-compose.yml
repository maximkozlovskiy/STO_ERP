# D2: ротація логів. Offline-first single-PC СТО рідко перезапускають — без cap docker json-file
# логи ростуть безмежно й з'їдають диск. Anchor застосовано до КОЖНОГО сервісу (max 5×10MB = 50MB/сервіс).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# T16: ліміти пам'яті на КОЖЕН сервіс. Single-PC СТО (мін. 8 ГБ per Check-Requirements) — без лімітів
# витік/сплеск у будь-якому контейнері може задушити хост. Compose v2 (не swarm) читає top-level
# mem_limit/cpus (deploy.resources ігнорується поза swarm), тож застосовуємо їх per-service.
# Сума лімітів (~3.4 ГБ) лишає запас під ОС+WSL2 на 8 ГБ машині; сервіси беруть менше під нормальним
# навантаженням — це стеля, не резервування.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - redis_data:/data
    # T16: maxmemory нижче mem_limit + noeviction — BullMQ-черги НЕ можна тихо витісняти
    # (ПРРО/SMS retry — критичні), краще OOM-помилка на write, ніж мовчазна втрата job.
    command: redis-server --appendonly yes --maxmemory 400mb --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    cpus: 0.5
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      # Modern minio/minio images ship NO curl/wget — `curl -f /minio/health/live`
      # always errors → minio never becomes healthy → api (depends_on service_healthy)
      # never starts → web+caddy cascade dead. Use the bundled `mc` client instead,
      # which is offline-safe and present in the server image.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s

  api:
    # Локальний image-ref (без ghcr-префікса): offline-модель бандлить образи через `docker save`
    # у CI (sto-api:$version) → `docker load` в інсталяторі під ТИМ САМИМ тегом. Раніше стояв
    # ghcr.io/your-org/sto-api:latest — інший registry-префікс І тег → compose ніколи не матчив
    # завантажений локальний образ і намагався pull-ити з ghcr (offline → fail на install/update).
    # VERSION приходить з .env (конкретна версія релізу, не latest — щоб rollback мав окремий тег).
    image: sto-api:${VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # MinIO — FilesService читає MINIO_PORT/ACCESS_KEY/SECRET_KEY через config.getOrThrow (crash на
      # bootstrap якщо відсутні). Раніше прокидався лише MINIO_ENDPOINT → api падав у crash-loop →
      # web+caddy (depends_on healthy) не стартували → повний провал offline-install. Усі значення з .env.
      MINIO_ENDPOINT: minio
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NOTIFICATION_ENC_KEY: ${NOTIFICATION_ENC_KEY}
      NODE_ENV: production
      TZ: Europe/Kyiv
    healthcheck:
      # node:20-alpine has no curl; use Node's built-in http (always present).
      # D1: б'ємо /api/health/LIVE (не /ready) — liveness не залежить від Redis/MinIO. Інакше
      # блимання залежності (ready→degraded) валило б api-контейнер → web+caddy cascade dead.
      # /ready лишається для оркестрації/моніторингу, не для container-healthcheck.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    # Локальний image-ref (див. коментар до api).
    image: sto-web:${VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      api: { condition: service_healthy }
    # T16: nginx:alpine віддає статику на :80; busybox wget присутній у образі.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    # T16: caddy proxy — depends_on з condition:service_healthy, щоб не приймати трафік до готовності
    # web/api (раніше — простий list без condition → 502 у вікні старту). caddy:2-alpine має wget.
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
